name: paypulse

# Every value has a default, so `docker compose up` works on a fresh clone.
# Override any of them in .env (see .env.example).

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paypulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paypulse}
      POSTGRES_DB: ${POSTGRES_DB:-paypulse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Dev server keeps workflow history in memory: a restart wipes it. Fine for a demo.
  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"   # gRPC, used by workers and clients
      - "8233:8233"   # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-paypulse}:${POSTGRES_PASSWORD:-paypulse}@postgres:5432/${POSTGRES_DB:-paypulse}
      TRAFFIC_RPS: ${TRAFFIC_RPS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${PAYMENT_SERVICE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl, so use the Python that is already there.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
