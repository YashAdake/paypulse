server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's DNS. Resolving per request (via the variable below) lets nginx start
    # even if the api container isn't up yet, and follows it across restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
