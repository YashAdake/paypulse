# One lint/format config for every Python service in the repo.
target-version = "py312"
line-length = 100

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "RUF",
]

[lint.isort]
known-first-party = ["app"]
